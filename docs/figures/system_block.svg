<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470"
     font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="860" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="30" y="28" font-size="15" font-weight="600" fill="#0f172a">Command path and independent verification path</text>
  <text x="30" y="46" font-size="11.5" fill="#64748b">The two paths share target definitions and nothing else &#8212; no common kinematics code or derivation.</text>

  <!-- shared source of truth -->
  <rect x="316" y="66" width="228" height="42" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <text x="430" y="85" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">targets.py</text>
  <text x="430" y="100" font-size="10.5" fill="#64748b" text-anchor="middle">SE(3) goals, generated by FK &#8594; on-manifold</text>

  <line x1="380" y1="108" x2="210" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="480" y1="108" x2="650" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- divider -->
  <line x1="430" y1="126" x2="430" y2="418" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="7 6"/>
  <text transform="translate(424,272) rotate(-90)" font-size="10.5" fill="#94a3b8" text-anchor="middle">independent implementations</text>

  <!-- COMMAND PATH -->
  <text x="60" y="136" font-size="11" font-weight="600" fill="#1e3a8a" letter-spacing="0.5">COMMAND</text>
  <rect x="60" y="146" width="300" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="164" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">pose_commander.py</text>
  <text x="210" y="179" font-size="10.5" fill="#3b5b93" text-anchor="middle">stage 1: IK (set_from_ik) &#183; stage 2: plan</text>
  <line x1="210" y1="190" x2="210" y2="212" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="60" y="212" width="300" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="230" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">MoveIt 2 &#183; OMPL RRTConnect</text>
  <text x="210" y="245" font-size="10.5" fill="#3b5b93" text-anchor="middle">joint-space trajectory</text>
  <line x1="210" y1="256" x2="210" y2="278" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="60" y="278" width="300" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="296" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">ros2_control @ 10 Hz</text>
  <text x="210" y="311" font-size="10.5" fill="#3b5b93" text-anchor="middle">joint_trajectory_controller</text>
  <line x1="210" y1="322" x2="210" y2="344" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="60" y="344" width="300" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="362" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">Feetech STS3215 driver</text>
  <text x="210" y="377" font-size="10.5" fill="#3b5b93" text-anchor="middle">USB serial, 1 Mbaud, 6 servos</text>

  <!-- PLANT -->
  <rect x="316" y="410" width="228" height="42" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="430" y="429" font-size="12.5" font-weight="600" fill="#78350f" text-anchor="middle">SO-101 arm &#183; 5-DOF</text>
  <text x="430" y="444" font-size="10.5" fill="#92400e" text-anchor="middle">the physical system</text>
  <line x1="210" y1="388" x2="330" y2="412" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- VERIFY PATH -->
  <text x="640" y="136" font-size="11" font-weight="600" fill="#065f46" letter-spacing="0.5">VERIFY</text>
  <rect x="500" y="146" width="300" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="650" y="164" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">verify_pose.py</text>
  <text x="650" y="179" font-size="10.5" fill="#2b7a63" text-anchor="middle">no MoveIt code anywhere in this path</text>
  <line x1="650" y1="190" x2="650" y2="212" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="500" y="212" width="300" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="650" y="230" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">screw axes from URDF</text>
  <text x="650" y="245" font-size="10.5" fill="#2b7a63" text-anchor="middle">S&#7522; = (&#969;, &#8722;&#969;&#215;q), home matrix M</text>
  <line x1="650" y1="256" x2="650" y2="278" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="500" y="278" width="300" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="650" y="296" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">Product-of-Exponentials FK</text>
  <text x="650" y="311" font-size="10.5" fill="#2b7a63" text-anchor="middle">own Rodrigues / screw-exponential math</text>
  <line x1="650" y1="322" x2="650" y2="344" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="500" y="344" width="300" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="650" y="362" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">error vs commanded target</text>
  <text x="650" y="377" font-size="10.5" fill="#2b7a63" text-anchor="middle">Euclidean position &#183; geodesic SO(3) angle</text>

  <!-- feedback -->
  <path d="M544 431 L825 431 L825 168 L800 168" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="836" y="300" transform="rotate(-90 836,300)" font-size="10.5" fill="#059669" text-anchor="middle">/joint_states &#8212; encoder-reported angles</text>
</svg>
