joints:
  # Values synced by name from the 2026-08-20 20:13 LeRobot calibration
  # (~/.cache/huggingface/lerobot/calibration/robots/so_follower/follower.json).
  # This is the first calibration with wrist_roll homed at its true neutral.
  shoulder_pan:
    id: 1
    homing_offset: -1941
    range_min: 878
    range_max: 3098
    p_coefficient: 16 
    i_coefficient: 0
    d_coefficient: 32
    return_delay_time: 0
    acceleration: 254

  shoulder_lift:
    id: 2
    homing_offset: -1176
    range_min: 843
    range_max: 3229
    p_coefficient: 16
    i_coefficient: 0
    d_coefficient: 32
    return_delay_time: 0
    acceleration: 254

  elbow_flex:
    id: 3
    homing_offset: 1282
    range_min: 889
    range_max: 3095
    # P raised 16 -> 32 -> 48. Gravity-sag tuning, each step verified against
    # the same target: at P=16 the elbow held ~0.14 rad (8 deg) below its
    # commanded position under the forearm+wrist load (commanded 2339 counts,
    # reported ~2430); P=32 halved that to 3.6 deg exactly as a steady-state
    # P-control error should. 48 targets ~1.5 deg. If the joint buzzes or
    # oscillates when holding, back off to 40.
    p_coefficient: 48
    i_coefficient: 0
    d_coefficient: 32
    return_delay_time: 0
    acceleration: 254

  wrist_flex:
    id: 4
    homing_offset: 1642
    range_min: 801
    range_max: 3199
    # P raised 16 -> 32: same gravity-sag reasoning as elbow_flex (~2.6 deg
    # droop at P=16), lighter load so smaller effect.
    p_coefficient: 32
    i_coefficient: 0
    d_coefficient: 32
    return_delay_time: 0
    acceleration: 254

  # wrist_roll: first offset taken with the wrist at its TRUE physical neutral
  # (2026-08-20 recalibration; the previous offset pointed "zero" near the
  # mechanical stop, which is why the wrist twisted to the stop on every run).
  # range 0/4095: the roll's travel crosses the encoder wrap point, so LeRobot
  # records no min/max; the servo enforces no angle window and the URDF limit
  # constrains the planner instead.
  wrist_roll:
    id: 5
    homing_offset: 586
    range_min: 0
    range_max: 4095
    p_coefficient: 16
    i_coefficient: 0
    d_coefficient: 32
    return_delay_time: 0
    acceleration: 254

  gripper:
    id: 6
    homing_offset: -1493
    range_min: 1575
    range_max: 2722
    p_coefficient: 16
    i_coefficient: 0
    d_coefficient: 32
    return_delay_time: 0
    acceleration: 254
    max_torque_limit: 500
    protection_current: 250
    overload_torque: 25
